<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Annotation Workbench</title><link rel="stylesheet" href="style.css"></head><body><main><header><p class="eyebrow">DATA TOOLKIT / 05</p><h1>Annotation Workbench</h1><p>Draw boxes, label objects, export a portable annotation set.</p></header><section class="toolbar"><label class="button">Open image<input id="file" type="file" accept="image/*" hidden></label><input id="classes" value="person, vehicle, object" aria-label="Comma-separated classes"><select id="label"></select><button id="undo">Undo last</button><button id="clear">Clear</button><button id="yolo">Export YOLO</button><button id="coco">Export COCO</button></section><div class="stage" id="stage"><canvas id="canvas"></canvas><div class="empty">Choose an image to start annotating</div></div><p id="status">Local only | annotations are not uploaded</p><ol id="items"></ol></main><script src="app.js"></script></body></html>
